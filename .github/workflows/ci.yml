# Checks every push and pull request. Render deploys a commit on main only after this passes
# (autoDeployTrigger: checksPass in render.yaml), so a broken change never replaces the live site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` also type-checks the project and fails on any TypeScript error.
      - name: Build
        run: npm run build

      # Start the production server exactly as Render will, then check that the page, the resume
      # and the generated images respond.
      - name: Smoke test
        run: |
          PORT=3000 npm run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 1
          done
          set -e
          curl -sf -o home.html http://localhost:3000
          grep -q "Shubham Sapkota" home.html
          for route in /Shubham_Sapkota_Resume.pdf /icon /apple-icon /opengraph-image /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

      - name: Server log
        if: failure()
        run: cat server.log || true
